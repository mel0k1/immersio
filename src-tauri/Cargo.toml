[workspace]
members = [".", "core"]
resolver = "2"

[package]
name = "immersio"
version = "0.6.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
discord-rich-presence = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-webpki-roots"] }
immersio-core = { path = "core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
