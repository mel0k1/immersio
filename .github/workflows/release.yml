name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm ci
      - name: Prepare updater signing
        id: sign
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret is not set — updater artifacts are disabled for this build"
          fi
      - name: Disable updater artifacts without signing key
        if: steps.sign.outputs.has_key == 'false'
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(j,null,2))"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Immersio ${{ github.ref_name }}"
          releaseBody: "Downloads for Windows, macOS (Intel and Apple Silicon) and Linux (deb, rpm, AppImage). macOS builds are unsigned."
          releaseDraft: false
          prerelease: false
          includeUpdaterArtifacts: true
          args: ${{ matrix.args }}

  updater-manifest:
    needs: build
    if: ${{ always() && !contains(needs.build.result, 'failure') && !contains(needs.build.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build latest.json from signed release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os, subprocess, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          ver = tag.lstrip("v")

          rel = json.loads(subprocess.check_output(
              ["gh", "api", "-R", repo, f"releases/tags/{tag}"]))
          assets = {a["name"]: a["browser_download_url"] for a in rel.get("assets", [])}

          RULES = [
              ("windows-x86_64", ("_x64-setup.exe", "_x64_en-US.msi")),
              ("darwin-aarch64", ("aarch64.app.tar.gz",)),
              ("darwin-x86_64", ("x64.app.tar.gz",)),
              ("linux-x86_64", (".AppImage",)),
          ]

          platforms = {}
          used = set()
          for plat, suffixes in RULES:
              for asset, url in assets.items():
                  if asset.endswith(".sig") or asset in used:
                      continue
                  if any(asset.endswith(suf) for suf in suffixes):
                      sig_name = asset + ".sig"
                      if sig_name not in assets:
                          print(f"::warning::{asset} has no .sig — skipped")
                          continue
                      sig = urllib.request.urlopen(url + ".sig").read().decode().strip()
                      platforms[plat] = {"signature": sig, "url": url}
                      used.update({asset, sig_name})
                      break

          if not platforms:
              print("::warning::no signed updater assets found — skipping latest.json")
              raise SystemExit(0)

          manifest = {
              "version": ver,
              "notes": f"Immersio {ver}",
              "pub_date": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          open("latest.json", "w").write(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          gh release upload -R "$GITHUB_REPOSITORY" "$TAG" latest.json --clobber
